<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آج کیا پکائیں؟</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F4EF;--card:#FFFFFF;--ink:#16241C;--mut:#5C6B62;--line:#D5DDD3;--acc:#1E6B47;--accink:#FFFFFF;--tur:#F3D58A;--turink:#5A4208;--new:#E6EEF9;--newink:#1F4E8C;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101712;--card:#18221B;--ink:#E8EFE9;--mut:#9DAEA3;--line:#2B3A30;--acc:#58C08A;--accink:#0B1A11;--tur:#4A3A12;--turink:#F3D58A;--new:#1B2A40;--newink:#A9C8F5}}
:root[data-theme="dark"]{--bg:#101712;--card:#18221B;--ink:#E8EFE9;--mut:#9DAEA3;--line:#2B3A30;--acc:#58C08A;--accink:#0B1A11;--tur:#4A3A12;--turink:#F3D58A;--new:#1B2A40;--newink:#A9C8F5}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq','Alvi Nastaleeq',serif;line-height:2.2;font-size:16px}
main{max-width:880px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:clamp(28px,6vw,40px);font-weight:600;margin:8px 0 0;line-height:2}
.sub{color:var(--mut);margin:0 0 12px;font-size:14px;line-height:2}
.lbl{font-size:13px;color:var(--mut);margin:10px 0 0;line-height:2}
.row{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;line-height:1.9;padding:2px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.chip:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.seg .chip{font-size:15px;padding:3px 18px}
input[type=search]{width:100%;font:inherit;font-size:15px;padding:4px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);margin-top:10px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:14px 0 4px;border-top:1px solid var(--line);padding-top:8px}
.btn{font:inherit;font-size:15px;line-height:2;padding:4px 18px;border-radius:12px;border:0;background:var(--acc);color:var(--accink);cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
#pick{display:none;margin:8px 0;padding:10px 18px;border:2px solid var(--acc);border-radius:16px;background:var(--card)}
#pick b{font-size:26px;font-weight:600;display:block;line-height:2.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.card h3{margin:0;font-size:19px;font-weight:600;line-height:2.1}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.tag{font-size:12px;line-height:1.9;padding:0 9px;border-radius:999px;border:1px solid var(--line);color:var(--mut)}
.tag.i{border-color:var(--acc);color:var(--acc)}
.tag.s{background:var(--tur);border-color:var(--tur);color:var(--turink)}
.tag.n{background:var(--new);border-color:var(--new);color:var(--newink)}
.empty{padding:24px;text-align:center;color:var(--mut)}
</style>
</head>

<main>
<h1>آج کیا پکائیں؟</h1>
<p class="sub">موسم، موجود اجزاء اور قسم چنیں، مناسب ڈشیں سامنے آ جائیں گی۔</p>
<div class="lbl">موسم</div>
<div class="row seg" id="sea"></div>
<div class="lbl">قسم</div>
<div class="row" id="cat"></div>
<div class="lbl">کھانے کا وقت</div>
<div class="row" id="meal"></div>
<div class="lbl">گھر میں موجود اجزاء (جو ہیں انہیں چنیں)</div>
<div id="ing"></div>
<input type="search" id="q" placeholder="ڈش کا نام تلاش کریں" aria-label="تلاش">
<div class="bar">
<span id="cnt"></span>
<span class="wrap">
<label class="chip" style="cursor:pointer"><input type="checkbox" id="all" style="margin-inline-end:6px">چنے ہوئے سب اجزاء لازمی</label>
<button class="btn ghost" id="clr">فلٹر ہٹائیں</button>
<button class="btn" id="rnd">کوئی ایک بتائیں</button>
</span>
</div>
<div id="pick" aria-live="polite"></div>
<div class="grid" id="out"></div>
</main>

function chips(el,items,key,single){

  const r=filt(),p=$('pick');p.style.display='block';
  if(!r.length){p.textContent='موجودہ فلٹر میں کوئی ڈش نہیں۔';return}
  const d=r[Math.floor(Math.random()*r.length)].d;
  p.innerHTML='<span style="color:var(--mut);font-size:13px">آج کی تجویز</span><b></b><span style="color:var(--mut);font-size:14px"></span>';
  p.querySelector('b').textContent=d[0];
  p.querySelector('span:last-child').textContent=d[1]+(d[2].length?' | '+d[2].join('، '):'');
  p.scrollIntoView({block:'nearest',behavior:'smooth'});
};
draw();
</script>
</body>
</html>
